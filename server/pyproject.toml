[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flybeat"
version = "0.1.0"
description = "초파리 커넥톰(MaleCNS v1.0)에게 웹 리듬게임을 강화학습으로 가르치는 프로젝트"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "scipy>=1.13",
  "pyyaml>=6.0",
  "torch>=2.4",
  "gymnasium>=1.0",
  "stable-baselines3>=2.4",
  "safetensors>=0.4",
  "jsonschema>=4.23",
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "soundfile>=0.12",  # 자동 채보 생성 (음원 읽기, OGG 변환)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["flybeat*"]

[tool.setuptools.package-data]
flybeat = ["config/*.yaml", "game/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
